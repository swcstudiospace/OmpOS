# Trivy secret scanner config for scripts/ci/scan-images.sh (TRIVY_SECRET_CONFIG).
#
# Accepted risk, approved by the repository owner on 2026-10-30 (ultrathink session 01a17752):
# the pinned omp package (@oh-my-pi/pi-coding-agent 18.12.5, SHA-512 checked in deploy/api.Containerfile)
# ships a debug RSA key and a self-signed certificate for its Claude-trace proxy. The constants are named
# CLAUDE_TRACE_DEBUG_KEY and CLAUDE_TRACE_DEBUG_CERT. The certificate subject is omp-claude-trace, and the
# proxy listens on 127.0.0.1. The key is not a credential for any service. The latest upstream release
# (18.14.0) still ships it, and the pinned bundle cannot be edited without breaking its checksum.
#
# Scope: exactly the three files of the pinned tarball that carry the key, nothing else. Any other secret still fails the scan.
# Re-check when omp changes or the upstream bundle drops the key: remove this file and the TRIVY_SECRET_CONFIG line in ci.yml.
allow-rules:
  - id: omp-bundled-trace-debug-key
    description: omp 18.12.5 debug key and certificate for the Claude-trace proxy (accepted risk, see header)
    path: opt/omp/(dist/cli\.js|dist/types/cli/claude-trace-cli\.d\.ts|src/cli/claude-trace-cli\.ts)$
