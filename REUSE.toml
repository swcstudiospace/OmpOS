version = 1

# REUSE 3.3 annotations. Licence texts live in LICENSES/<SPDX-id>.txt. The submodules under plugins/
# (claude-ultrathink, agent-swarm, agent-substrate) are separate REUSE projects and carry their own terms.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 SWC Studio"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Fonts bundled with the desktop head: SIL Open Font License 1.1, one OFL.txt per family.
[[annotations]]
path = "src/OmpOS.Native.Views/Assets/Fonts/DMSans/**"
precedence = "override"
SPDX-FileCopyrightText = "2014 The DM Sans Project Authors (https://github.com/googlefonts/dm-fonts)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/OmpOS.Native.Views/Assets/Fonts/Anybody/**"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Anybody Project Authors (https://github.com/Etcetera-Type-Co/Anybody)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/OmpOS.Native.Views/Assets/Fonts/SpaceMono/**"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Space Mono Project Authors (https://github.com/googlefonts/spacemono)"
SPDX-License-Identifier = "OFL-1.1"

# Vendored Bootstrap (banner of bootstrap.css: "Copyright 2011-2024 The Bootstrap Authors", MIT).
[[annotations]]
path = "apps/OmpOS.Web/wwwroot/lib/bootstrap/**"
precedence = "override"
SPDX-FileCopyrightText = "2011-2024 The Bootstrap Authors"
SPDX-License-Identifier = "MIT"
