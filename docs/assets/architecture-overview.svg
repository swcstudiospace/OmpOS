<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="14">
  <title id="t">Autonogrammer architecture overview</title>
  <desc id="d">Three heads (desktop, web, Android) sit on one presentation layer. The desktop head runs the harness libraries in its own process, which start omp and its four plugins, or reach omp on a remote machine over ssh. The web head talks to the ASP.NET Core API over HTTPS and server-sent events. The API runs sessions through the same harness libraries and, for cloud agents, reaches an agent worker over a WebSocket; the API, the worker and the PostgreSQL session log are intended to run on Railway, where only a staged private worker is deployed so far.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Railway band (intended topology; only a staged private worker is deployed) -->
  <rect x="500" y="228" width="440" height="296" rx="12" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="516" y="514" fill="#5b21b6" font-weight="600">Railway (intended; only a staged worker runs)</text>

  <!-- Heads -->
  <g fill="#ffffff" stroke="#6d28d9" stroke-width="1.5">
    <rect x="40" y="24" width="270" height="72" rx="10"/>
    <rect x="345" y="24" width="270" height="72" rx="10"/>
    <rect x="650" y="24" width="270" height="72" rx="10"/>
  </g>
  <g fill="#1c1c1a" text-anchor="middle">
    <text x="175" y="52" font-weight="600">Desktop head</text>
    <text x="175" y="74" font-size="12">Avalonia, apps/Autonogrammer.Native</text>
    <text x="480" y="52" font-weight="600">Web head</text>
    <text x="480" y="74" font-size="12">Blazor WebAssembly, apps/Autonogrammer.Web</text>
    <text x="785" y="52" font-weight="600">Android head</text>
    <text x="785" y="74" font-size="12">Avalonia, apps/Autonogrammer.Android (not run)</text>
  </g>

  <!-- Presentation layer -->
  <rect x="40" y="132" width="880" height="62" rx="10" fill="#6d28d9"/>
  <g fill="#ffffff" text-anchor="middle">
    <text x="480" y="158" font-weight="600">Presentation layer: Autonogrammer.Presentation (view models, no UI framework)</text>
    <text x="480" y="180" font-size="12">Autonogrammer.Native.Views (Avalonia views) and Autonogrammer.UI (Razor components) draw the same models</text>
  </g>
  <g stroke="#5b21b6" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175,96 L175,130"/>
    <path d="M480,96 L480,130"/>
    <path d="M785,96 L785,130"/>
  </g>

  <!-- Harness (desktop process) -->
  <rect x="40" y="228" width="420" height="116" rx="10" fill="#fafaf9" stroke="#6d28d9" stroke-width="1.5"/>
  <g fill="#1c1c1a">
    <text x="56" y="252" font-weight="600">Harness libraries (in the desktop process)</text>
    <text x="56" y="274" font-size="12">Harness.Acp (ACP v1, stdio) · Harness.AgentLoop: launch</text>
    <text x="56" y="292" font-size="12">plan, stages, steering, hooks bridge, run modes, Remote</text>
    <text x="56" y="310" font-size="12">Harness.Terminal · Workspace · Worktrees · Providers</text>
    <text x="56" y="328" font-size="12">MCP import · checkpoints · mentions and ignore files</text>
  </g>
  <path d="M240,194 L240,226" stroke="#5b21b6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- API -->
  <rect x="520" y="262" width="400" height="82" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <g fill="#1c1c1a">
    <text x="536" y="286" font-weight="600">Autonogrammer.Api (ASP.NET Core)</text>
    <text x="536" y="306" font-size="12">sessions, runs, SSE events, changes, providers, workspace</text>
    <text x="536" y="324" font-size="12">settings, cloud control plane; runs sessions in process</text>
  </g>
  <path d="M700,194 L700,260" stroke="#5b21b6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="712" y="222" font-size="12" fill="#5b21b6">HTTPS + SSE (web head)</text>

  <!-- engines -->
  <g fill="#ffffff" stroke="#6d28d9" stroke-width="1.5">
    <rect x="40" y="410" width="200" height="86" rx="10"/>
    <rect x="260" y="410" width="200" height="86" rx="10"/>
    <rect x="520" y="410" width="190" height="86" rx="10"/>
    <rect x="730" y="410" width="190" height="86" rx="10"/>
  </g>
  <g fill="#1c1c1a">
    <text x="56" y="436" font-weight="600">omp acp</text>
    <text x="56" y="456" font-size="12">the engine, started with the</text>
    <text x="56" y="474" font-size="12">four plugins (Ultrathink,</text>
    <text x="56" y="490" font-size="12">Substrate, Swarm, GSD-Core)</text>
    <text x="276" y="436" font-weight="600">Remote machine</text>
    <text x="276" y="456" font-size="12">your own ssh reaches</text>
    <text x="276" y="474" font-size="12">omp on another host</text>
    <text x="536" y="436" font-weight="600">AgentWorker</text>
    <text x="536" y="456" font-size="12">one cloud agent: a</text>
    <text x="536" y="474" font-size="12">WebSocket bridge to omp</text>
    <text x="746" y="436" font-weight="600">PostgreSQL</text>
    <text x="746" y="456" font-size="12">shared session log</text>
    <text x="746" y="474" font-size="12">of API and worker</text>
  </g>
  <g stroke="#5b21b6" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M140,344 L140,408"/>
    <path d="M360,344 L360,408"/>
    <path d="M615,344 L615,408"/>
    <path d="M825,344 L825,408"/>
  </g>
  <text x="152" y="384" font-size="12" fill="#5b21b6">stdio</text>
  <text x="372" y="384" font-size="12" fill="#5b21b6">ssh</text>
  <text x="627" y="384" font-size="12" fill="#5b21b6">WebSocket</text>
  <text x="837" y="384" font-size="12" fill="#5b21b6">SQL</text>

  <text x="40" y="546" font-size="12" fill="#444441">Layers: heads, then services, then libraries, then contracts. The web head never starts a process.</text>
</svg>
