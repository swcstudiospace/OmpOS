# OmpOS local backend stack. The ONLY supported invocation (podman-compose 1.6.0+):
#   podman-compose --profile backend -f deploy/compose.yaml up -d
# No `version:` key (Compose Spec), no runtime-specific extensions.
# Every published port binds to 127.0.0.1. Every password is required from the environment; none has a default.
# Local-only difference: GreptimeDB runs without user authentication (no --user-provider). Production sends the
# OTLP Authorization Basic header from the hosting environment; this stack never configures it.
services:
  postgres:
    image: docker.io/timescale/timescaledb:2.13.1-pg16 # production parity: timescale-postgis-ssl:pg16-ts2.13
    container_name: ompos-postgres
    environment:
      POSTGRES_USER: ${OMPOS_POSTGRES_USER:-ompos}
      POSTGRES_DB: ${OMPOS_POSTGRES_DB:-ompos}
      POSTGRES_PASSWORD: ${OMPOS_POSTGRES_PASSWORD:?set OMPOS_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    profiles: ["backend"]
  dragonfly:
    image: docker.io/dragonflydb/dragonfly:v1.27.1
    container_name: ompos-dragonfly
    command: ["--bind=0.0.0.0", "--dir=/data"]
    environment:
      DFLY_requirepass: ${OMPOS_DRAGONFLY_PASSWORD:?set OMPOS_DRAGONFLY_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dragonfly-data:/data
    profiles: ["backend"]
  greptimedb:
    image: docker.io/greptime/greptimedb:v1.1.4
    container_name: ompos-greptimedb
    command: ["standalone", "start", "--http-addr=0.0.0.0:4000", "--rpc-bind-addr=0.0.0.0:4001"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - greptimedb-data:/tmp/greptimedb
    profiles: ["backend"]
volumes:
  postgres-data:
  dragonfly-data:
  greptimedb-data:
