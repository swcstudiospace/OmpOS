# OmpOS local dependency stack (podman-compose 1.6.0+). The ONLY supported invocation:
#   podman-compose --profile workflows up
# No `version:` key (Compose Spec), no runtime-specific extensions.
services:
  temporal:
    image: docker.io/temporalio/temporal:1.9.1
    container_name: ompos-temporal
    command: server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233" # gRPC frontend
      - "127.0.0.1:8233:8233" # Web UI
    volumes:
      - temporal-data:/home/temporal # image user `temporal` (uid 1000) owns this path
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    profiles: ["workflows"]
  postgres:
    image: docker.io/library/postgres:17
    container_name: ompos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ompos}
      POSTGRES_DB: ${POSTGRES_DB:-ompos}
      POSTGRES_PASSWORD: ${OMPOS_POSTGRES_PASSWORD:?set OMPOS_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-ompos}", "-d", "${POSTGRES_DB:-ompos}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    profiles: ["workflows"]
volumes:
  temporal-data:
  postgres-data:
