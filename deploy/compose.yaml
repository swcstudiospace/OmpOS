# Autonogrammer local stack. The ONLY supported invocations (podman-compose 1.6.0+):
#   podman-compose --profile backend -f deploy/compose.yaml up -d
# The cloud agent worker is not part of this file: a locally built image has no digest to pin. Run it with the commands in
# the header of deploy/worker.Containerfile.
# No `version:` key (Compose Spec), no runtime-specific extensions.
# Every published port binds to 127.0.0.1. Every password is required from the environment; none has a default.
# Local-only difference: GreptimeDB runs without user authentication (no --user-provider). Production sends the
# OTLP Authorization Basic header from the hosting environment; this stack never configures it.
services:
  postgres:
    image: docker.io/timescale/timescaledb:2.13.1-pg16@sha256:1b2b5508848bbbbd671e02aeafd75fefb57771168f0782b6842bfb2f66af444b # production parity: timescale-postgis-ssl:pg16-ts2.13
    container_name: autonogrammer-postgres
    environment:
      POSTGRES_USER: ${AUTONOGRAMMER_POSTGRES_USER:-autonogrammer}
      POSTGRES_DB: ${AUTONOGRAMMER_POSTGRES_DB:-autonogrammer}
      POSTGRES_PASSWORD: ${AUTONOGRAMMER_POSTGRES_PASSWORD:?set AUTONOGRAMMER_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    profiles: ["backend"]
  dragonfly:
    image: docker.io/dragonflydb/dragonfly:v1.27.1@sha256:385cb73078f4dabe43d536766842eab444f3d791b0fcf86951decdcbcda37917
    container_name: autonogrammer-dragonfly
    command: ["--bind=0.0.0.0", "--dir=/data"]
    environment:
      DFLY_requirepass: ${AUTONOGRAMMER_DRAGONFLY_PASSWORD:?set AUTONOGRAMMER_DRAGONFLY_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dragonfly-data:/data
    profiles: ["backend"]
  greptimedb:
    image: docker.io/greptime/greptimedb:v1.1.4@sha256:9726587eac95d0360755254cd59a528dbf48abfdf268478aea6a644f62afe44c
    container_name: autonogrammer-greptimedb
    command: ["standalone", "start", "--http-addr=0.0.0.0:4000", "--rpc-bind-addr=0.0.0.0:4001"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - greptimedb-data:/tmp/greptimedb
    profiles: ["backend"]
volumes:
  postgres-data:
  dragonfly-data:
  greptimedb-data:
