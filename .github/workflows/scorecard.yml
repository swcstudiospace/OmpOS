# OpenSSF Scorecard, weekly and on demand. Runs on ubuntu-24.04 so it can reach api.securityscorecards.dev.
# The Omega pool never ran this workflow (OQ-175). Action pins resolved with gh api on 2026-10-29:
#   ossf/scorecard-action v2.5.0 (annotated tag 46dc3187 -> commit fa7117db), github/codeql-action v4.39.1 (-> 9b325408).
name: scorecard

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 2'

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
