# OpenSSF Scorecard, weekly and on demand. UNVERIFIED: never run; the self-hosted pool must reach api.securityscorecards.dev
# and the SARIF upload needs code scanning enabled on the repository. Action pins resolved with gh api on 2026-10-29:
#   ossf/scorecard-action v2.5.0 (annotated tag 46dc3187 -> commit fa7117db), github/codeql-action v4.39.1 (-> 9b325408).
name: scorecard

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 2'

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
