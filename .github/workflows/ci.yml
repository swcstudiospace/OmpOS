# OmpOS CI (Phase 1, decision D-05).
# Mirrors bootstrap.sh, then adds the audit, scan, and compose gates.
# Podman is the only container runtime referenced here; Docker is not used.
# Every job runs on the Omega CI runner pool ([self-hosted, linux, x64, omega-ci],
# swcstudiospace/Omega-Prime docs/ci-runners.md), never on GitHub-hosted runners. Pull requests
# from forks are skipped: fork code never reaches the pool.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  build-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    steps:
      # Action tags verified 2026-10-20 against the GitHub releases API:
      # checkout v7.0.1, setup-dotnet v6.0.0, upload-artifact v7.0.2.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore OmpOS.Linux.slnf --locked-mode
      - run: dotnet build OmpOS.Linux.slnf -c Release --no-restore -warnaserror
      - run: dotnet test OmpOS.Linux.slnf -c Release --no-build --report-trx --coverlet --coverlet-output-format cobertura --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults
      - run: dotnet format OmpOS.Linux.slnf --verify-no-changes --no-restore
      - name: Vulnerable packages (list exits 0 even on findings, so the parse is the gate)
        run: |
          dotnet list OmpOS.Linux.slnf package --vulnerable --include-transitive --format json > vuln.json
          python3 - <<'PY'
          import json
          import sys
          document = json.load(open("vuln.json"))
          hits = [
              package
              for project in document["projects"]
              for framework in project.get("frameworks", [])
              for key in ("topLevelPackages", "transitivePackages")
              for package in framework.get(key, [])
              if package.get("vulnerabilities")
          ]
          print(json.dumps(hits, indent=1))
          sys.exit(1 if hits else 0)
          PY
      - name: Secret scan (gitleaks CLI, pinned)
        run: |
          # RUNNER_TEMP, not /tmp: jobs on one pool host share /tmp.
          curl -sSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin" && tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --exit-code 1 --log-level warn .
      - name: Require podman (for compose validation)
        # The Omega CI runner image ships podman; jobs have no sudo to install it.
        run: |
          command -v podman >/dev/null || { echo "::error::podman is not on PATH; add it to the Omega CI runner image" >&2; exit 1; }
          podman --version
      - name: Validate compose (podman-compose needs the podman binary and the profile)
        run: |
          pipx install podman-compose==1.6.0
          podman-compose --profile workflows -f deploy/compose.yaml config --services | grep -qx temporal
          podman-compose --profile workflows -f deploy/compose.yaml config -q

  shells:
    # The MAUI head's Android target on the Omega CI pool. The runner image pre-installs the
    # maui-android workload (the SDK directory is read-only, so there is no `dotnet workload
    # install` step), JDK 17 and Android SDK 36. iOS and MacCatalyst need macOS and Xcode, which
    # the Linux pool does not have; OmpOS.App.csproj adds those targets only on macOS.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    needs: build-test
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: MAUI head, Android (only when the project exists)
        if: hashFiles('apps/OmpOS.App/OmpOS.App.csproj') != ''
        run: |
          dotnet workload list
          dotnet restore apps/OmpOS.App/OmpOS.App.csproj --locked-mode
          dotnet build apps/OmpOS.App/OmpOS.App.csproj -c Release --no-restore -warnaserror -f net10.0-android
