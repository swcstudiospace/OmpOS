# Autonogrammer CI (Phase 1, decision D-05).
# Mirrors bootstrap.sh, then adds the audit, scan, and compose gates.
# Podman is the only container runtime referenced here; Docker is not used.
# Jobs run on GitHub-hosted runners (ubuntu-24.04, windows-2022, macos-14).
# The Omega pool cannot start rootless podman or Chrome (OQ-168), so it is not used.
# Pull requests from forks are skipped: fork code never receives this repository's secrets.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull-request runs only; a push to main (or any branch) always runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # GitHub-hosted runners are dedicated 4-vCPU VMs. Cap MSBuild at that so a
  # runner image that reports more CPUs cannot oversubscribe the VM.
  DOTNET_PROCESSOR_COUNT: 4
  MSBUILDDISABLENODEREUSE: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  AUTONOGRAMMER_POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
  AUTONOGRAMMER_DRAGONFLY_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build-test:
    timeout-minutes: 90
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      # Action tags verified 2026-10-20 against the GitHub releases API:
      # checkout v7.0.1, setup-dotnet v6.0.0, upload-artifact v7.0.2.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Plugin submodules (the public ones always; the private agent-substrate needs the SUBMODULE_TOKEN secret)
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          git submodule update --init --recursive plugins/claude-ultrathink plugins/agent-swarm
          if [ -n "${SUBMODULE_TOKEN:-}" ]; then
            header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SUBMODULE_TOKEN" | base64 -w0)"
            echo "::add-mask::$header"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$header" \
              git submodule update --init --recursive plugins/agent-substrate
          else
            echo "::warning::SUBMODULE_TOKEN is not set: plugins/agent-substrate is not checked out and the substrate plugin reports Unavailable. Add a read-only token for swcstudiospace/substrate as the SUBMODULE_TOKEN secret."
          fi
      - name: Install rootful podman and Chrome
        run: |
          bash scripts/ci/install-podman-rootful.sh
          bash scripts/ci/install-chrome.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Autonogrammer.Linux.slnf --locked-mode
      - run: dotnet build Autonogrammer.Linux.slnf -c Release --no-restore -warnaserror
      # apps/Autonogrammer.App does not exist in this repository, and tools/gweb holds only the named/ and stock/ asset
      # folders (no project), so neither can join Autonogrammer.Linux.slnf or this build step. Add them here when they gain projects.
      # Script checks run before the container steps so a later podman failure still reports them.
      # Podman is installed rootful above; Chrome is installed for the browser smoke.
      - run: dotnet format Autonogrammer.Linux.slnf --verify-no-changes --no-restore
      - name: Vulnerable packages (list exits 0 even on findings, so the parse is the gate)
        run: |
          dotnet list Autonogrammer.Linux.slnf package --vulnerable --include-transitive --format json > vuln.json
          python3 scripts/ci/check-vulnerable-packages.py vuln.json
      - name: Secret scan (gitleaks CLI, pinned in scripts/ci/gitleaks.env; the same script bootstrap.sh runs)
        run: bash scripts/ci/secret-scan.sh
      - name: Plugin tests (node:test suite of plugins/gsd-core-omp; the same script bootstrap.sh runs)
        run: bash scripts/ci/plugin-node-tests.sh
      - name: Repository checks (brand set, changelog, documentation structure, provider reference, settings parity; the same script bootstrap.sh runs)
        run: bash scripts/ci/repo-checks.sh
      - name: Licence checks (NOTICE and THIRD-PARTY-NOTICES.md against the restored NuGet cache; the same script bootstrap.sh runs)
        run: bash scripts/ci/check-licences.sh
      - name: SBOM freshness (docs/legal/sbom.spdx.json against the lock files and container pins; licences the restored NuGet cache lacks come from the committed file)
        run: bash scripts/ci/check-sbom.sh
      - name: OpenAPI breaking changes (pull requests only; ALLOW_BREAKING_API or a BREAKING-API commit line permits them)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 scripts/ci/test_check_openapi_breaking.py
          python3 scripts/ci/check-openapi-breaking.py --base "origin/${{ github.base_ref }}"
      # The web payload budget is not a step of its own: scripts/web-smoke/run-smoke.sh ends its real-bundle half with it (size-budget.mjs, limits in size-budget.json), so it runs in the browser smoke step below.
      - name: Python unit tests of the CI and legal scripts
        run: python3 -m unittest scripts/ci/test_check_skip_markers.py scripts/legal/test_generate_sbom.py
      - name: Node tests of the web scripts (service-worker manifest refresh, the route check's boot-shell decision)
        run: node --test scripts/vercel/refresh-web-manifest.test.mjs scripts/web-smoke/a11y/routes.test.mjs
      - name: Browser smoke with axe-core, the accessibility checks and the web payload budget (needs Node and Chrome on the runner; mirrors the bootstrap step)
        run: |
          out_dir="$RUNNER_TEMP/web-smoke"
          mkdir -p "$out_dir"
          OUT_DIR="$out_dir" bash scripts/web-smoke/run-smoke.sh
      - name: Require podman (rootful wrapper from the setup step; scripts call podman, never docker)
        run: |
          command -v podman >/dev/null || { echo "::error::podman is not on PATH" >&2; exit 1; }
          podman --version
          podman info >/dev/null
      - name: Start test services (throwaway TimescaleDB and Dragonfly)
        run: |
          env_file="$(bash scripts/test-services.sh up)"
          echo "TEST_SERVICES_ENV=$env_file" >> "$GITHUB_ENV"
      # Two test modules at a time, the runner's vCPU budget. Every concurrent
      # pool job shares the job uid's RLIMIT_NPROC, and 15 test hosts at once
      # failed to start threads ("Failed to create CoreCLR", OutOfMemory).
      - name: Test (throwaway TimescaleDB and Dragonfly for the API, session-store and coordination tests)
        run: |
          source "$TEST_SERVICES_ENV"
          dotnet test Autonogrammer.Linux.slnf -c Release --no-build --max-parallel-test-modules 2 --report-trx --coverlet --coverlet-output-format cobertura --results-directory TestResults
      - name: Stop test services
        if: always()
        run: |
          bash scripts/test-services.sh down
          if [ -n "${TEST_SERVICES_ENV:-}" ]; then rm -f "$TEST_SERVICES_ENV"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-results
          path: TestResults
      - name: Validate compose (podman-compose needs the podman binary and the backend profile)
        run: |
          pipx install podman-compose==1.6.0
          services="$(podman-compose --profile backend -f deploy/compose.yaml config --services)"
          for service in postgres dragonfly greptimedb; do
            grep -qx "$service" <<<"$services" || { echo "error: service $service is missing from profile backend" >&2; exit 1; }
          done
          while read -r service; do
            case "$service" in
              postgres|dragonfly|greptimedb) ;;
              *) echo "error: unexpected service $service in profile backend; only postgres, dragonfly and greptimedb are allowed" >&2; exit 1 ;;
            esac
          done <<<"$services"
          podman-compose --profile backend -f deploy/compose.yaml config -q
      - name: Boot backend profile (detached)
        run: podman-compose --profile backend -f deploy/compose.yaml up -d
      - name: Wait for backend services (each within 300s)
        run: |
          wait_ready() {
            local name="$1"
            shift
            local deadline=$((SECONDS + 300))
            until "$@" >/dev/null 2>&1; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "error: $name is not ready within 300 seconds" >&2
                exit 1
              fi
              sleep 3
            done
          }
          dragonfly_ping() {
            { exec 3<>/dev/tcp/127.0.0.1/6379; } 2>/dev/null || return 1
            printf 'AUTH %s\r\nPING\r\n' "$AUTONOGRAMMER_DRAGONFLY_PASSWORD" >&3
            local auth="" pong=""
            IFS= read -r -t 5 auth <&3 || true
            IFS= read -r -t 5 pong <&3 || true
            exec 3>&-
            [ "$auth" = $'+OK\r' ] && [ "$pong" = $'+PONG\r' ]
          }
          wait_ready "autonogrammer-postgres" podman exec autonogrammer-postgres pg_isready -h 127.0.0.1 -p 5432
          wait_ready "autonogrammer-dragonfly" dragonfly_ping
          wait_ready "autonogrammer-greptimedb" curl -fsS http://127.0.0.1:4000/health
      - name: Tear down backend profile
        if: always()
        run: podman-compose --profile backend -f deploy/compose.yaml down -v

  # Image scan on a push. The job installs rootful podman and the pinned trivy, builds both images
  # (--format docker keeps HEALTHCHECK; the builder is still podman) and scans them. Pull requests are excluded.
  image-scan:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: build-test
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install rootful podman and the pinned trivy
        run: |
          bash scripts/ci/install-podman-rootful.sh
          bash scripts/ci/install-trivy.sh
      - name: Build and scan
        run: |
          podman build --format docker -f deploy/api.Containerfile -t autonogrammer-api:ci .
          podman build --format docker -f deploy/worker.Containerfile -t autonogrammer-agent-worker:ci .
          bash scripts/ci/scan-images.sh localhost/autonogrammer-api:ci localhost/autonogrammer-agent-worker:ci

  # Builds the Android head on ubuntu-24.04 (Phase 24 criterion 4). No device or emulator is needed.
  # The SDK and the android workload are installed in the job. iOS and Mac Catalyst need macOS and Xcode.
  android:
    timeout-minutes: 90
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      # Action tags as pinned by build-test above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Android SDK platform 36 and build-tools 36.0.0
        run: bash scripts/ci/install-android-sdk.sh
      - name: Android workload (installed when this runner does not already have it)
        run: |
          dotnet workload list
          dotnet workload list | grep -qi android || dotnet workload install android
      - run: dotnet restore apps/Autonogrammer.Android/Autonogrammer.Android.csproj --locked-mode
      - name: Vulnerable packages of the Android head (same gate as build-test)
        run: |
          dotnet list apps/Autonogrammer.Android/Autonogrammer.Android.csproj package --vulnerable --include-transitive --format json > vuln-android.json
          python3 scripts/ci/check-vulnerable-packages.py vuln-android.json
      - name: Android platform 36 and build-tools 36.0.0 (installed only when the runner lacks them)
        run: |
          set -eu
          sdk="${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          if [ -f "$sdk/platforms/android-36/android.jar" ] && [ -x "$sdk/build-tools/36.0.0/aapt2" ]; then
            echo "Android platform 36 and build-tools 36.0.0 are present; nothing to install."
            exit 0
          fi
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || { echo "error: sdkmanager not found at $sdkmanager" >&2; exit 1; }
          # sdkmanager exits before yes finishes writing, so yes can end on SIGPIPE; only sdkmanager's status counts here.
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - run: dotnet build apps/Autonogrammer.Android/Autonogrammer.Android.csproj -c Release --no-restore -warnaserror

  # Publishes the Avalonia desktop head on each OS. Framework-dependent: the lock file has no RID
  # graph, so this does not pass -r and does not unlock the restore. A self-contained RID publish
  # needs a lock-file update first.
  desktop:
    name: desktop (${{ matrix.name }})
    timeout-minutes: 45
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2022
            name: windows
          - os: macos-14
            name: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: apps/Autonogrammer.Native/packages.lock.json
      - name: Build and publish the Avalonia desktop head
        run: |
          dotnet restore apps/Autonogrammer.Native/Autonogrammer.Native.csproj --locked-mode
          dotnet build apps/Autonogrammer.Native/Autonogrammer.Native.csproj -c Release --no-restore -warnaserror
          dotnet publish apps/Autonogrammer.Native/Autonogrammer.Native.csproj -c Release --no-restore --self-contained false -o publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.name }}
          path: publish
