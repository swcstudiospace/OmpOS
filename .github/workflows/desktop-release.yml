# Desktop packages and installers for apps/Autonogrammer.Native (Avalonia): Linux x64, Windows x64 and macOS arm64.
#
# Triggers
#   workflow_dispatch  builds the six release files and uploads them as workflow artifacts. No release is touched. The release
#                      job is skipped, so a dispatch run writes no SHA256SUMS-desktop. The optional version_suffix input makes
#                      the run a rehearsal of a prerelease tag: VERSION becomes <VersionPrefix>-<suffix> for the file names and
#                      the installer, and the tag gates apply as for a tag push (private plugin credential required, and the
#                      bundle-plugins.sh tag checks run with the synthetic tag v<VersionPrefix>-<suffix>). No release is created.
#   push of v*         builds the same six files, then the release job (only after all three legs passed) verifies them with
#                      scripts/release/verify_desktop_assets.py, writes SHA256SUMS-desktop, waits up to 15 minutes for the draft
#                      release that release.yml creates (fails if it never appears), attaches the seven files, waits up to 150
#                      minutes for release.yml's images, SBOM and SHA256SUMS-images (fails at once if release.yml's run for the
#                      tag failed or was cancelled), and only then publishes the draft (--latest, or --prerelease for a -suffix
#                      tag). The notes are never changed. The release stays a hidden draft until everything is present; after a
#                      failure, re-run the failed jobs of the failed workflow run, then re-run the release job. Re-running it on an
#                      already published release changes nothing.
#
# Release files (six): the linux-x64 leg makes Autonogrammer-<version>-linux-x64.tar.gz and -linux-x64.deb, the win-x64 leg makes
# -win-x64.zip and -win-x64-Setup.exe, and the osx-arm64 leg makes -osx-arm64.zip and -osx-arm64.dmg. The .deb comes from
# scripts/release/package-deb.sh, the installer from scripts/release/windows/Autonogrammer.iss (Inno Setup 6, installed with choco),
# and the .dmg from scripts/release/package-dmg.sh. Each leg runs the verifier with --platform right after packaging.
# The installer is smoke-tested on windows-2025 only by scripts/release/windows/smoke-test-installer.ps1; its logs are uploaded
# as a workflow artifact when the test fails. No job installs the .deb or opens the .dmg.
#
# Signing: the Windows installer is per-machine (C:\Program Files\Autonogrammer, UAC prompt) and NOT signed, so SmartScreen warns.
# The macOS app is ad-hoc signed by scripts/release/package-desktop.sh (codesign --sign -). That is not a Developer ID signature
# and not notarization: Gatekeeper still shows the unidentified-developer prompt. Linux packages are not signed.
#
# Private plugin: plugins/agent-substrate needs a credential on every leg. Secrets: SUBSTRATE_DEPLOY_KEY (an SSH read-only deploy
# key on swcstudiospace/substrate; preferred) or SUBMODULE_TOKEN (an HTTPS token). With neither, a tag build and a rehearsal fail;
# a plain dispatch build warns and packages without the substrate plugin.
#
# Version rule (copied from release.yml): the tag is vMAJOR.MINOR.PATCH[-prerelease], it equals the <VersionPrefix> of
# Directory.Build.props without the prerelease suffix, and the tagged commit is reachable from origin/main.
#
# release.yml also runs on v* and is the ONLY workflow that creates the GitHub Release: a draft with the changelog notes, to which
# it attaches the image archives, the SBOM and SHA256SUMS-images. This workflow never creates a release.
#
# Runners: ubuntu-24.04, windows-2025 and macos-26. macos-14 is not used: GitHub retired all macOS 14 images on 2026-11-02
# (actions/runner-images issue 15226). macos-26 is the arm64 image that ADE plan Tier 1 (macOS 26) targets.
#
# The packages do not contain omp or Bun. The app needs both installed separately on the machine that runs it.
#
# Action pins were resolved with gh api on 2026-11-03; the tag is written next to each pin.
#
# The RID restore does not use locked mode. NuGet compares the lock file's runtime-identifier set for equality, so one
# packages.lock.json cannot satisfy restore -r linux-x64, restore -r win-x64 and restore -r osx-arm64 at once (NU1004).
# CI=true would turn locked mode back on through Directory.Build.props, so this job sets RestoreLockedMode=false.
# Package versions still come from the committed lock file; only the per-RID asset graph is evaluated on the runner.
name: desktop-release

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Rehearsal of a prerelease tag: build as <VersionPrefix>-<suffix> (characters 0-9 A-Z a-z . -) and enforce the same gates as a tag build (private plugin credential, plugin tag checks). Empty builds <VersionPrefix> leniently. Creates no release.'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  package:
    name: package (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: windows-2025
            rid: win-x64
          - runner: macos-26
            rid: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The public plugin submodules come first. The private agent-substrate has its own step, so its credential reaches git for
      # that one command only. persist-credentials is off above, so the checkout's GITHUB_TOKEN header is not stored for later fetches.
      - name: Plugin submodules for ultrathink, swarm and realm (public)
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive plugins/claude-ultrathink plugins/agent-swarm plugins/agent-realm
      # Two credentials are supported and SUBSTRATE_DEPLOY_KEY wins when both exist. It is an SSH private key registered as a
      # read-only deploy key on swcstudiospace/substrate. The key is written under RUNNER_TEMP with umask 077 and removed on exit,
      # also on failure. GitHub's Ed25519 host key is fetched with ssh-keyscan and pinned only if its fingerprint equals the one
      # published at docs.github.com ("GitHub's SSH key fingerprints"); otherwise the step stops. SUBMODULE_TOKEN is the HTTPS path.
      # Neither value is echoed. Both secrets absent: an error on a tag build and on a rehearsal (dispatch with version_suffix), a warning on a plain dispatch build.
      - name: Plugin submodule agent-substrate (private; needs the SUBSTRATE_DEPLOY_KEY or SUBMODULE_TOKEN secret)
        shell: bash
        env:
          SUBSTRATE_DEPLOY_KEY: ${{ secrets.SUBSTRATE_DEPLOY_KEY }}
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          set -euo pipefail
          if [ -n "${SUBSTRATE_DEPLOY_KEY:-}" ]; then
            umask 077
            # Linux and macOS use the plain path. On the Windows leg (Git Bash) the mixed style, D:/a/_temp/..., is accepted by both
            # the MSYS ssh of Git for Windows and Win32-OpenSSH, so it does not matter which one git resolves.
            tmp_root="$RUNNER_TEMP"
            if [ "${RUNNER_OS:-}" = "Windows" ]; then
              tmp_root="$(cygpath -m "$RUNNER_TEMP")"
            fi
            key_dir="$(mktemp -d "$tmp_root/substrate-key.XXXXXX")"
            trap 'rm -rf -- "$key_dir"' EXIT
            key="$key_dir/id_ed25519"
            known="$key_dir/known_hosts"
            scan="$key_dir/scan"
            printf '%s\n' "$SUBSTRATE_DEPLOY_KEY" | tr -d '\r' > "$key"
            chmod 600 "$key"
            expected="SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU"
            ssh-keyscan -T 15 -t ed25519 github.com > "$scan" 2>/dev/null || true
            actual="$(ssh-keygen -l -E sha256 -f "$scan" 2>/dev/null | awk '{print $2}' || true)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::the SSH host key that github.com presented does not match the Ed25519 fingerprint GitHub publishes. Refusing to continue." >&2
              exit 1
            fi
            cp "$scan" "$known"
            GIT_SSH_COMMAND="ssh -i '$key' -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile='$known' -o StrictHostKeyChecking=yes" \
              git -c 'url.git@github.com:swcstudiospace/substrate.git.insteadOf=https://github.com/swcstudiospace/substrate.git' \
              submodule update --init --recursive plugins/agent-substrate
          elif [ -n "${SUBMODULE_TOKEN:-}" ]; then
            header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SUBMODULE_TOKEN" | base64 | tr -d '\n')"
            echo "::add-mask::$header"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$header" \
              git submodule update --init --recursive plugins/agent-substrate
          else
            if [[ "$REF" == refs/tags/v* ]] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$VERSION_SUFFIX" ]; }; then
              echo "::error::neither the SUBSTRATE_DEPLOY_KEY nor the SUBMODULE_TOKEN repository secret is set. A tag build or a rehearsal (dispatch with version_suffix) needs one of them to check out the private plugins/agent-substrate. Add a read-only deploy key (SUBSTRATE_DEPLOY_KEY) or a read-only token (SUBMODULE_TOKEN) for swcstudiospace/substrate." >&2
              exit 1
            fi
            echo "::warning::neither SUBSTRATE_DEPLOY_KEY nor SUBMODULE_TOKEN is set, so plugins/agent-substrate is not checked out and this plain dispatch build's packages will not contain the substrate plugin. A tag build or a rehearsal fails here instead."
          fi
      - name: Resolve the version (tag rule as in release.yml)
        shell: bash
        run: bash scripts/ci/check-release-version.sh
      # A rehearsal: on a dispatch run with version_suffix set, VERSION becomes <VersionPrefix>-<suffix> (the shape of a prerelease
      # tag) for the file names, the installer and the app bundle. A rehearsal also enforces the tag gates (the private plugin
      # credential and the bundle-plugins.sh tag checks) and creates no release: the release job runs on tag pushes only.
      # check-release-version.sh has already appended VERSION to GITHUB_ENV; the later line wins.
      - name: Apply the rehearsal version suffix (dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.version_suffix != ''
        shell: bash
        env:
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION_SUFFIX" =~ ^[0-9A-Za-z.-]+$ ]]; then
            echo "::error::the version_suffix input must match [0-9A-Za-z.-]+" >&2
            exit 1
          fi
          printf 'VERSION=%s-%s\n' "$BASE_VERSION" "$VERSION_SUFFIX" >> "$GITHUB_ENV"
          echo "Rehearsal build: VERSION is $BASE_VERSION-$VERSION_SUFFIX"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Use the pinned SDK only (the runner runtime must not change the lock file)
        shell: bash
        run: bash scripts/ci/install-pinned-sdk.sh
      - name: Restore the desktop app for its runtime identifier
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          # Locked mode cannot accept one lock file for three different -r values (NU1004, exact RID-set compare).
          dotnet restore apps/Autonogrammer.Native/Autonogrammer.Native.csproj -r "$RID" -p:RestoreLockedMode=false --force-evaluate -p:TargetLatestRuntimePatch=false -p:RuntimeFrameworkVersion=10.0.15
      - name: Publish self-contained
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          dotnet publish apps/Autonogrammer.Native/Autonogrammer.Native.csproj -c Release -r "$RID" --self-contained true --no-restore -p:TargetLatestRuntimePatch=false -p:RuntimeFrameworkVersion=10.0.15 -o "publish/$RID"
      # Tag gate of bundle-plugins.sh (required plugins present, LICENSE at the plugin root). It runs for a tag push with the real tag
      # and for a rehearsal (dispatch with version_suffix) with the synthetic tag v<BASE_VERSION>-<suffix>, so a rehearsal fails
      # wherever the tag build would. BASE_VERSION comes from check-release-version.sh through GITHUB_ENV; the suffix was validated
      # by the rehearsal step above. A plain dispatch passes an empty tag and keeps the lenient mode.
      - name: Bundle the plugins at their pinned commits (tag gate; see scripts/release/bundle-plugins.sh)
        shell: bash
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$VERSION_SUFFIX" ]; then
            tag="v${BASE_VERSION}-${VERSION_SUFFIX}"
          fi
          bash scripts/release/bundle-plugins.sh "publish/$RID" . "$tag"
      - name: Package
        id: package
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          archive="$(bash scripts/release/package-desktop.sh "$RID" "publish/$RID" "$VERSION" dist)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Build the .deb (linux-x64)
        if: matrix.rid == 'linux-x64'
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          bash scripts/release/package-deb.sh "$VERSION" "publish/$RID" dist
      - name: Build the .dmg (osx-arm64)
        if: matrix.rid == 'osx-arm64'
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/dmg-input"
          rm -rf -- "$stage"
          mkdir -p "$stage"
          ditto -x -k "$ARCHIVE" "$stage"
          bash scripts/release/package-dmg.sh "$VERSION" "$stage/Autonogrammer.app" dist
      - name: Build the Windows installer (Inno Setup 6)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }
          }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "ISCC.exe not found at $iscc" }
          $dist = Join-Path $PWD 'dist'
          $source = Join-Path $PWD 'publish\win-x64'
          $base = "Autonogrammer-$env:VERSION-win-x64-Setup"
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$source" "/DOutputDir=$dist" "/DOutputBaseFilename=$base" 'scripts\release\windows\Autonogrammer.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $dist "${base}.exe") -PathType Leaf)) { throw "the installer was not produced: ${base}.exe" }
      # Fail this leg early when its files are missing, empty or malformed. The release job runs the same verifier on all six.
      # Windows runners may not expose python3, so the step picks the first interpreter that is Python 3.
      - name: Verify this leg's release files
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          py=""
          for candidate in python3 python; do
            if "$candidate" -c 'import sys; sys.exit(0 if sys.version_info[0] >= 3 else 1)' >/dev/null 2>&1; then
              py="$candidate"
              break
            fi
          done
          if [ -z "$py" ]; then
            echo "::error::no Python 3 interpreter on PATH" >&2
            exit 1
          fi
          "$py" scripts/release/verify_desktop_assets.py --dir dist --version "$VERSION" --platform "$RID"
      - name: Smoke-test the Windows installer (silent install, launch, uninstall)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD "dist\Autonogrammer-$env:VERSION-win-x64-Setup.exe"
          $logs = Join-Path $env:RUNNER_TEMP 'installer-logs'
          pwsh -NoProfile -File scripts/release/windows/smoke-test-installer.ps1 -SetupPath $setup -Version $env:VERSION -LogDirectory $logs
          if ($LASTEXITCODE -ne 0) { throw "the installer smoke test failed with exit code $LASTEXITCODE" }
      - name: Upload the installer logs
        if: failure() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs-${{ matrix.rid }}
          path: ${{ runner.temp }}/installer-logs
          if-no-files-found: ignore
      - name: Job summary
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          {
            echo "### Autonogrammer desktop $VERSION ($RID)"
            echo ""
            for file in dist/*; do
              echo "- Package: $(basename "$file")"
            done
            case "$RID" in
              win-x64) echo "- Windows installer: per-machine (C:\\Program Files\\Autonogrammer, UAC prompt), not signed, so SmartScreen warns on first run." ;;
              osx-arm64) echo "- macOS app: ad-hoc signed (codesign --sign -), not Developer ID signed and not notarized. Gatekeeper shows the unidentified-developer prompt." ;;
              *) echo "- Not signed." ;;
            esac
            echo "- Requires omp and Bun, installed separately on the machine that runs the app. The package does not contain them."
            echo "- Steps for testers: docs/runbooks/desktop-release.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the packages as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autonogrammer-desktop-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  # The only job that publishes, and it never creates a release: release.yml is the only workflow that does (a draft with the
  # changelog notes). Ordering, all in this one job, after all three package legs succeeded (needs: package fails when a leg fails):
  #   1. verify the six files and write SHA256SUMS-desktop;  2. wait up to 15 minutes for release.yml's draft of this tag;
  #   3. attach the seven files (--clobber) and check the release lists them;  4. wait up to 150 minutes for release.yml's image
  #   archives, SBOM and SHA256SUMS-images on the same release, failing at once if release.yml's run for this tag failed or was
  #   cancelled;  5. publish (--draft=false; --latest, or --prerelease for a -suffix tag). The notes are never changed.
  # Until step 5 the release is a draft nobody sees. Re-running the job on an already published release changes nothing.
  release:
    name: attach desktop packages and publish
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # Only the release scripts are needed (the verifier). The token is not persisted in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/release
          persist-credentials: false
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: autonogrammer-desktop-*
          path: dist
          merge-multiple: true
      - name: Verify the six files and write SHA256SUMS-desktop
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/verify_desktop_assets.py --dir dist --version "${TAG#v}" --write-sums dist/SHA256SUMS-desktop
      - name: Wait for the draft release that release.yml creates
        shell: bash
        run: |
          set -euo pipefail
          # Conclusion of the newest release.yml run for this tag's commit: "" while it runs, else success, failure, cancelled, ...
          release_yml_conclusion() {
            gh run list --workflow release.yml --branch "$TAG" --event push --limit 20 --json headSha,conclusion \
              --jq "map(select(.headSha == \"$GITHUB_SHA\")) | .[0].conclusion // \"\""
          }
          deadline=$((SECONDS + 900))
          # gh finds a draft release by its tag (cli/cli FetchRelease: published lookup plus GraphQL release(tagName) for drafts).
          until gh release view "$TAG" >/dev/null 2>&1; do
            conclusion="$(release_yml_conclusion || true)"
            case "$conclusion" in
              failure | cancelled | timed_out)
                echo "::error::release.yml ended with '$conclusion' and never created the release for $TAG. Its changelog check may have failed. Fix it, re-run release.yml, then re-run this job." >&2
                exit 1
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no release for $TAG appeared within 15 minutes. release.yml creates it (as a draft, with the changelog notes); check that workflow run." >&2
              exit 1
            fi
            echo "No release for $TAG yet; waiting 20 s for release.yml."
            sleep 20
          done
      - name: Attach the packages to the release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber
          # Every local file must be listed on the release with the same size.
          listed="$(gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"')"
          failed=0
          for file in dist/*; do
            line="$(printf '%s\t%s' "$(basename "$file")" "$(stat -c %s "$file")")"
            if ! grep -Fxq -- "$line" <<<"$listed"; then
              echo "::error::$(basename "$file") is not on the release with its local size" >&2
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
      - name: Wait for the image archives, SBOM and checksums that release.yml attaches
        shell: bash
        run: |
          set -euo pipefail
          # File names are the ones release.yml's artifacts job uploads; they carry the full tag, also a prerelease tag.
          required=(
            "autonogrammer-api-${TAG}.tar"
            "autonogrammer-agent-worker-${TAG}.tar"
            "autonogrammer-${TAG}.spdx.json"
            "SHA256SUMS-images"
          )
          release_yml_conclusion() {
            gh run list --workflow release.yml --branch "$TAG" --event push --limit 20 --json headSha,conclusion \
              --jq "map(select(.headSha == \"$GITHUB_SHA\")) | .[0].conclusion // \"\""
          }
          deadline=$((SECONDS + 9000))
          success_misses=0
          while true; do
            listed="$(gh release view "$TAG" --json assets --jq '.assets[].name' || true)"
            missing=()
            for name in "${required[@]}"; do
              if ! grep -Fxq -- "$name" <<<"$listed"; then
                missing+=("$name")
              fi
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              echo "release.yml's assets are all on the release."
              break
            fi
            conclusion="$(release_yml_conclusion || true)"
            case "$conclusion" in
              failure | cancelled | timed_out)
                echo "::error::release.yml ended with '$conclusion', so ${missing[*]} will not appear on the release. Re-run its failed jobs, then re-run this job. The release stays a draft." >&2
                exit 1
                ;;
              success)
                success_misses=$((success_misses + 1))
                if [ "$success_misses" -ge 3 ]; then
                  echo "::error::release.yml succeeded but ${missing[*]} are still not on the release" >&2
                  exit 1
                fi
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::${missing[*]} did not appear on the release within 150 minutes. The release stays a draft." >&2
              exit 1
            fi
            echo "Waiting 30 s for release.yml's assets (missing: ${missing[*]})."
            sleep 30
          done
      - name: Publish the release (only now)
        shell: bash
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$draft" != "true" ]; then
            echo "The release for $TAG is already published; nothing to publish."
          else
            case "$TAG" in
              *-*) gh release edit "$TAG" --draft=false --prerelease ;;
              *) gh release edit "$TAG" --draft=false --latest ;;
            esac
          fi
          {
            echo "### Release $TAG"
            echo ""
            echo "Published after, in this order: the six desktop packages and SHA256SUMS-desktop were verified and attached, and release.yml's image archives, SBOM and SHA256SUMS-images were present on the same release. The notes are release.yml's changelog notes."
            echo "- Windows installer: per-machine (C:\\Program Files\\Autonogrammer, UAC prompt), not signed, so SmartScreen warns."
            echo "- macOS app: ad-hoc signed (codesign --sign -), not Developer ID signed and not notarized."
            echo "- If a leg or release.yml fails: re-run the failed jobs of that workflow run, then re-run this job. The draft stays hidden until everything is present."
          } >> "$GITHUB_STEP_SUMMARY"
