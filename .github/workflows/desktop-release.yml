# Desktop packages for apps/Autonogrammer.Native (Avalonia): Linux x64, Windows x64 and macOS arm64.
#
# Triggers
#   workflow_dispatch  builds the three packages and uploads them as workflow artifacts. No release is touched. The release
#                      job is skipped, so a dispatch run writes no SHA256SUMS.
#   push of v*         builds the same packages, writes SHA256SUMS, and attaches them to the GitHub Release for that tag.
#                      If release.yml already published the release, this job uploads the archives and does not rewrite its
#                      notes or turn it back into a draft. If no release exists yet, this job creates a published release
#                      so the installers are downloadable. A prerelease suffix on the tag still marks the release as a prerelease.
#
# Version rule (copied from release.yml): the tag is vMAJOR.MINOR.PATCH[-prerelease], it equals the <VersionPrefix> of
# Directory.Build.props without the prerelease suffix, and the tagged commit is reachable from origin/main.
#
# release.yml also runs on v* and creates the published release with changelog notes. This job must not fail when that
# release already exists, or the desktop archives never get attached.
#
# Runners: ubuntu-24.04, windows-2025 and macos-26. macos-14 is not used: GitHub retired all macOS 14 images on 2026-11-02
# (actions/runner-images issue 15226). macos-26 is the arm64 image that ADE plan Tier 1 (macOS 26) targets.
#
# The packages do not contain omp or Bun. The app needs both installed separately on the machine that runs it.
#
# Action pins were resolved with gh api on 2026-11-03; the tag is written next to each pin.
#
# The RID restore does not use locked mode. NuGet compares the lock file's runtime-identifier set for equality, so one
# packages.lock.json cannot satisfy restore -r linux-x64, restore -r win-x64 and restore -r osx-arm64 at once (NU1004).
# CI=true would turn locked mode back on through Directory.Build.props, so this job sets RestoreLockedMode=false.
# Package versions still come from the committed lock file; only the per-RID asset graph is evaluated on the runner.
name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  package:
    name: package (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: windows-2025
            rid: win-x64
          - runner: macos-26
            rid: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the version (tag rule as in release.yml)
        shell: bash
        run: bash scripts/ci/check-release-version.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Use the pinned SDK only (the runner runtime must not change the lock file)
        shell: bash
        run: bash scripts/ci/install-pinned-sdk.sh
      - name: Restore the desktop app for its runtime identifier
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          # Locked mode cannot accept one lock file for three different -r values (NU1004, exact RID-set compare).
          dotnet restore apps/Autonogrammer.Native/Autonogrammer.Native.csproj -r "$RID" -p:RestoreLockedMode=false --force-evaluate -p:TargetLatestRuntimePatch=false -p:RuntimeFrameworkVersion=10.0.13
      - name: Publish self-contained
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          dotnet publish apps/Autonogrammer.Native/Autonogrammer.Native.csproj -c Release -r "$RID" --self-contained true --no-restore -p:TargetLatestRuntimePatch=false -p:RuntimeFrameworkVersion=10.0.13 -o "publish/$RID"
      - name: Package
        id: package
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          archive="$(bash scripts/release/package-desktop.sh "$RID" "publish/$RID" "$VERSION" dist)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Job summary
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          {
            echo "### Autonogrammer desktop $VERSION ($RID)"
            echo ""
            echo "- Package: $(basename "$ARCHIVE")"
            echo "- Not signed with a publisher certificate and not notarized."
            echo "- Requires omp and Bun, installed separately on the machine that runs the app. The package does not contain them."
            echo "- Steps for testers: docs/runbooks/desktop-release.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the package as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autonogrammer-desktop-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: attach desktop packages
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the three packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: autonogrammer-desktop-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS for exactly the three packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=( * )
          if [ "${#files[@]}" -ne 3 ]; then
            echo "::error::expected 3 packages in dist, found ${#files[@]}" >&2
            exit 1
          fi
          version="${TAG#v}"
          for file in "${files[@]}"; do
            case "$file" in
              "Autonogrammer-${version}-"*) ;;
              *)
                echo "::error::$file does not start with Autonogrammer-${version}-" >&2
                exit 1
                ;;
            esac
          done
          sha256sum -- "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attach the packages to the GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Desktop packages for $TAG. Not signed with a publisher certificate and not notarized."
            echo ""
            echo "Verify SHA256SUMS before running a package. Steps: docs/runbooks/desktop-release.md in the tagged commit."
          } > "$notes"
          assets=( dist/* )
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [ "$draft" = "true" ]; then
              gh release edit "$TAG" --draft=false ${pre[@]+"${pre[@]}"} --title "Autonogrammer $TAG" --notes-file "$notes"
            fi
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag ${pre[@]+"${pre[@]}"} --title "Autonogrammer $TAG" --notes-file "$notes"
          fi
          {
            echo "### Desktop packages on $TAG"
            echo ""
            echo "The three archives and SHA256SUMS are attached to the GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
