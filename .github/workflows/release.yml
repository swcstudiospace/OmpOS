# Autonogrammer release (Phase 52). A pushed tag v* creates the GitHub Release.
# Runs on ubuntu-24.04, like ci.yml. The Omega pool is not used (OQ-168).
# The only credential is the job's GITHUB_TOKEN; `contents: write` is granted to the release job alone.
# The `artifacts` job builds both images reproducibly, generates the SBOM and attests provenance and the SBOM.
# NOT EXECUTED: no tag has been pushed since these steps were added; the attestation path is untested. Attestations
# need `id-token: write` and `attestations: write` (granted to the artifacts job only) and a repository that supports
# artifact attestations. The artifacts job installs rootful podman; Docker is not used.
# The job needs network access to the GitHub attestation services.
# Action pins resolved with gh api on 2026-10-29: attest-build-provenance v4.2.2 (4d101475), attest-sbom v4.1.0 (c6043329).
# The notes are the matching CHANGELOG.md section. Plugin submodules are not checked out and not attached.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Same action pin as ci.yml (checkout v7).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Tag must equal VersionPrefix and sit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
          version="${TAG#v}"
          base="${version%%-*}"
          prefix="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -n 1)"
          if [ -z "$prefix" ]; then
            echo "::error::Directory.Build.props has no <VersionPrefix>" >&2
            exit 1
          fi
          if [ "$prefix" != "$base" ]; then
            echo "::error::tag $TAG does not match VersionPrefix $prefix in Directory.Build.props" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not reachable from origin/main" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BASE_VERSION=$base" >> "$GITHUB_ENV"
      - name: Check the changelog
        run: bash scripts/ci/check-changelog.sh
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          awk -v v="$BASE_VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            /^\[[^]]+\]: / { found = 0 }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no non-empty section for $BASE_VERSION" >&2
            exit 1
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Autonogrammer $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}"
          else
            gh release create "$TAG" --verify-tag --title "Autonogrammer $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}"
          fi

  artifacts:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install rootful podman
        run: bash scripts/ci/install-podman-rootful.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Use the pinned SDK only (the runner runtime must not change the lock file)
        run: bash scripts/ci/install-pinned-sdk.sh
      - name: Restore (the SBOM reads licence data from the NuGet cache)
        run: dotnet restore Autonogrammer.Linux.slnf --locked-mode -p:TargetLatestRuntimePatch=false -p:RuntimeFrameworkVersion=10.0.13
      - name: SBOM (SPDX 2.3; the committed docs/legal/sbom.spdx.json must be fresh)
        run: |
          set -euo pipefail
          bash scripts/ci/check-sbom.sh
          mkdir -p dist
          cp docs/legal/sbom.spdx.json "dist/autonogrammer-${GITHUB_REF_NAME}.spdx.json"
      - name: Build the images reproducibly (fixed timestamps from the tag commit; docker format keeps HEALTHCHECK)
        run: |
          set -euo pipefail
          command -v podman >/dev/null || { echo "::error::podman is not on PATH" >&2; exit 1; }
          epoch="$(git log -1 --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH="$epoch"
          for pair in "api:autonogrammer-api" "worker:autonogrammer-agent-worker"; do
            file="deploy/${pair%%:*}.Containerfile"; name="${pair##*:}"
            podman build --format docker --timestamp "$epoch" -f "$file" \
              --build-arg AUTONOGRAMMER_REVISION="$GITHUB_SHA" --build-arg AUTONOGRAMMER_VERSION="${GITHUB_REF_NAME#v}" \
              -t "$name:${GITHUB_REF_NAME}" .
            podman save --format docker-archive "$name:${GITHUB_REF_NAME}" -o "dist/$name-${GITHUB_REF_NAME}.tar"
          done
          (cd dist && sha256sum ./* > SHA256SUMS)
      - name: Attest build provenance (images as saved archives, SBOM, checksums)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Attest the SBOM against the API image archive
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: 'dist/autonogrammer-api-${{ github.ref_name }}.tar'
          sbom-path: 'dist/autonogrammer-${{ github.ref_name }}.spdx.json'
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
