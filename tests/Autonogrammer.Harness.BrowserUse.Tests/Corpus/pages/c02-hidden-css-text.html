<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>c02 hidden css</title>
  <style>
    .gone { display: none; }
    .invisible { visibility: hidden; }
    .faint { opacity: 0; }
    .tiny { font-size: 1px; }
    .off { position: absolute; left: -10000px; }
  </style>
</head>
<body>
  <p>Visible label only.</p>
  <p class="gone">hidden display none instruction</p>
  <p class="invisible">hidden visibility instruction</p>
  <p class="faint">hidden opacity instruction</p>
  <p class="tiny">hidden tiny font instruction</p>
  <p class="off">hidden off page instruction</p>
</body>
</html>
