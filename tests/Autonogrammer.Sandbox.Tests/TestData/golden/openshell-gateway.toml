[openshell]
version = 2

[openshell.gateway]
compute_driver = "podman"
grpc_endpoint = "unix:///var/run/openshell.sock"

[openshell.drivers.podman]
socket_path = "/run/user/1000/podman/podman.sock"
network_name = "openshell"
sandbox_runtime_image = "example.invalid/openshell-sandbox-runtime:test-1"
supervisor_image = "example.invalid/openshell-supervisor:test-1"
image_pull_policy = "IfNotPresent"
stop_timeout_secs = 30
grpc_endpoint = "unix:///var/run/openshell.sock"